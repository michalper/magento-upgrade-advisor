[project]
name = "magento-upgrade-advisor"
version = "0.1.0"
description = "LLM reasoning layer over mcp-magento-audit's upgrade-plan data, with a programmatic faithfulness check and a model-comparison eval harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michal Per" }]
keywords = ["llm", "magento", "mcp", "anthropic", "eval", "upgrade"]
dependencies = ["mcp-magento-audit>=0.4", "anthropic>=0.40", "pydantic>=2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/michalper/magento-upgrade-advisor"
Repository = "https://github.com/michalper/magento-upgrade-advisor"
Issues = "https://github.com/michalper/magento-upgrade-advisor/issues"

[project.scripts]
magento-upgrade-advisor = "magento_upgrade_advisor.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magento_upgrade_advisor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PERF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# mcp-magento-audit ships no py.typed marker yet — nothing to fix on this side.
module = "mcp_magento_audit.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["magento_upgrade_advisor"]

[tool.coverage.report]
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
